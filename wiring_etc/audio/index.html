<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Briefing: Audio pre-Wiring</title>
        <meta name="robots" content="noindex,nofollow" />
        <link rel="stylesheet" href="../styles.css" />
        <script>
            const ghUsername = "simonmajor";
            const ghRepo = "webgists";
            const ghBasePath = "wiring_etc/audio";
        </script>
    </head>
    <body>
        <h1><a href=".." target="_top">Back Up to Parent Folder</a></h1>
        <h1>
            Published at:
            <script>
                document.write(
                    `<a href="https://${ghUsername}.github.io/${ghRepo}/${ghBasePath}"" target="_top">https://${ghUsername}.github.io/${ghRepo}/${ghBasePath}</a>`
                );
            </script>
        </h1>

        <h1>Briefing: Audio pre-Wiring</h1>

        <p>Lorem ipsum</p>

        <script>
            (async () => {
                const response = await fetch(
                    `https://api.github.com/repos/${ghUsername}/${ghRepo}/contents/${ghBasePath}`
                );
                const data = await response.json();
                let htmlString = "<ul>";

                for (let file of data) {
                    htmlString += `<li><a href="https://${ghUsername}.github.io/${ghRepo}/${file.path}">${file.name}</a></li>`;
                }

                htmlString += "</ul>";
                document.getElementById("listing").innerHTML = htmlString;
            })();
        </script>
        <h1>Files</h1>
        <div id="listing"></div>
    </body>
</html>

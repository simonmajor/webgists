    <body>
        <p>Stub to be editied</p>
        <p>
            <img src="./quincecreative-under-construction-2891888_1920.jpg" />
        </p>
        <script>
            (async () => {
                const response = await fetch("https://api.github.com/repos/simonmajor/webgists/contents/");
                const data = await response.json();
                let htmlString = "<ul>";

                for (let file of data) {
                    htmlString += `<li><a href="${file.path}">${file.name}</a></li>`;
                }

                htmlString += "</ul>";
                document.getElementById("listing")[0].innerHTML = htmlString;
            })();
        </script>
        <div id="listing"></div>
    </body>
